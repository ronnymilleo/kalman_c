name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      # Let every job report, so one failure does not hide another
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Unity comes in as a git submodule
          submodules: recursive

      # Without clang-format the format target does nothing and the formatting check would pass vacuously
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DKALMAN_C_BUILD_TESTS=ON
          -DKALMAN_C_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      # The build runs clang-format on every source, so any change means unformatted code was committed
      - name: Check formatting
        if: matrix.compiler == 'gcc'
        run: git diff --exit-code -- '*.c' '*.h'

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DKALMAN_C_BUILD_TESTS=ON
          -DKALMAN_C_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # gcov writes one report per source, which the Coveralls uploader finds next to the sources. It can also report
      # the system headers the code includes, so the reports of anything outside src/ are removed
      - name: Report coverage
        run: |
          find build -name "*.gcda" | while read -r gcda; do gcov -p -o "$gcda" "$gcda"; done > /dev/null 2>&1
          find . -maxdepth 1 -name '*.gcov' ! -name '*#src#*' -delete
          curl -sL https://coveralls.io/coveralls-linux.tar.gz | tar -xz && ./coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  naming:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      # clang-tidy reads the compile commands that CMake writes
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKALMAN_C_BUILD_TESTS=ON

      - name: Check naming
        run: clang-tidy -p build -warnings-as-errors='*' src/*.c tests/*.c

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # AddressSanitizer, UndefinedBehaviorSanitizer and LeakSanitizer, on Linux only
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DKALMAN_C_BUILD_TESTS=ON
          -DKALMAN_C_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  windows:
    # The runner has Ninja and the LLVM clang; Visual Studio's own compiler is not used here
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DKALMAN_C_BUILD_TESTS=ON
          -DKALMAN_C_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DKALMAN_C_BUILD_TESTS=ON
          -DKALMAN_C_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
