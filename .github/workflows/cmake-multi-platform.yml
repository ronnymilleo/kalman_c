name: CI

on:
  push:
    branches: ["main", "develop", "dev/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    name: Build and test (${{ matrix.os }}, ${{ matrix.c_compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every platform report, so one failure does not hide another
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
          - os: ubuntu-latest
            c_compiler: clang
          # Windows builds with the clang that ships on the runner
          - os: windows-latest
            c_compiler: clang
          - os: macos-latest
            c_compiler: clang

    steps:
      - uses: actions/checkout@v4
        with:
          # Unity comes in as a git submodule
          submodules: recursive

      # Without clang-format the format target does nothing and the formatting check below would pass vacuously
      - name: Install clang-format
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DKALMAN_C_BUILD_TESTS=ON
          -DKALMAN_C_WARNINGS_AS_ERRORS=ON

      # The build runs clang-format over the sources before compiling
      - name: Build
        run: cmake --build build

      # Formatting is checked on one job only; the others would report the same files
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.c_compiler == 'gcc'
        run: git diff --exit-code -- '*.c' '*.h'

      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      # clang-tidy reads the compile commands that CMake writes
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKALMAN_C_BUILD_TESTS=ON

      - name: Run clang-tidy
        run: clang-tidy -p build -warnings-as-errors='*' src/*.c tests/*.c

  sanitizers:
    name: Sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # AddressSanitizer, UndefinedBehaviorSanitizer and, on Linux, LeakSanitizer
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DKALMAN_C_BUILD_TESTS=ON
          -DKALMAN_C_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
